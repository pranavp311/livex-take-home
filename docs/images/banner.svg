<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <!-- Source for banner.png. GitHub doesn't load web fonts in SVG, so the README uses the PNG,
       rendered from this file with Inter and DotGothic16 loaded. -->
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#050DC8" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.38" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="#FFFFFF"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#E5E5E5"/>

  <text x="96" y="132" font-family="DotGothic16, ui-monospace, monospace" font-size="15" letter-spacing="1.5" fill="#787878">&gt;&gt; LIVEX AI TAKE-HOME</text>
  <text x="92" y="220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="76" letter-spacing="-2.5" fill="#050505">Schedule<tspan fill="#050DC8">.</tspan></text>
  <text x="96" y="272" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#050505" fill-opacity="0.62">Run your cal.com calendar from one chat.</text>

  <!-- A Book card, echoing the app's confirm-before-write step -->
  <g transform="translate(880 126)">
    <rect width="318" height="148" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="24" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#050505">Intro: Maya Chen</text>
    <text x="24" y="64" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#050505" fill-opacity="0.55">Thu 29 · 2:00–2:30 PM</text>
    <rect x="24.6" y="88.6" width="104.8" height="38.8" rx="19.4" fill="#FFFFFF" stroke="#050DC8" stroke-width="1.2"/>
    <circle cx="45" cy="108" r="14" fill="#050DC8"/>
    <path d="M39.5 108h11M46 103.5l4.5 4.5-4.5 4.5" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="113.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#050DC8">Book</text>
    <rect x="138.6" y="88.6" width="86.8" height="38.8" rx="19.4" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.2"/>
    <text x="156" y="113.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#050505">Change</text>
  </g>
</svg>
